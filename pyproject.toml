[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soundsculpt"
version = "0.1.0"
description = "Wavelet-packet based multiscale sound sculpting"
requires-python = ">=3.10"
dependencies = ["numpy", "PyWavelets"]

[tool.setuptools.packages.find]
where = ["soundsculpt"]

[tool.pytest.ini_options]
pythonpath = ["soundsculpt"]
testpaths = ["tests"]
